<tui-root>
  <div class="relative h-full overflow-hidden">
    <tui-loader
      class="block h-full"
      [overlay]="true"
      [loading]="isAppLoading()"
    >
      <main tuiScrollRef class="app-content">
        <tui-pull-to-refresh
          class="app-refresh"
          (pulled)="requestSynchronization()"
        >
          <router-outlet />
        </tui-pull-to-refresh>
      </main>
    </tui-loader>

    <app-floating-header (toggleDarkMode)="toggleDarkMode()" />

    <router-outlet name="sheet" />

    <app-floating-footer />
  </div>

  <ng-template
    [tuiDialogOptions]="{
    label: 'Sync needs your attention',
    size: 's'
  }"
    [(tuiDialog)]="conflictDialogOpen"
  >
    <p>
      {{ conflictCount() === 1 ? '1 item was changed in more than one place.' :
      conflictCount() + ' items were changed in more than one place.' }}
    </p>

    <p>
      Nothing has been overwritten. Synchronization is paused until you choose
      which versions to keep.
    </p>

    <footer class="mt-4 flex justify-end gap-2">
      <button
        tuiButton
        type="button"
        appearance="secondary"
        (click)="conflictDialogOpen.set(false)"
      >
        Later
      </button>

      <button tuiButton type="button" (click)="reviewConflicts()">
        Review conflicts
      </button>
    </footer>
  </ng-template>
</tui-root>
