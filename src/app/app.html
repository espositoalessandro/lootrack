<tui-root>
  <div class="relative h-dvh overflow-hidden">
    <tui-loader
      class="block h-full"
      [overlay]="true"
      [loading]="!!(transactionsLoading$ | async)"
    >
      <main class="app-content">
        <router-outlet />
      </main>
    </tui-loader>

    <app-floating-header
      class="app-header"
      (toggleDarkMode)="toggleDarkMode()"
    />

    <router-outlet name="sheet" />

    <app-floating-footer class="app-footer" />
  </div>
</tui-root>
