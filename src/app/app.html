<tui-root>
  <div class="relative h-full overflow-hidden">
    <tui-loader
      class="block h-full"
      [overlay]="true"
      [loading]="!!(transactionsLoading$ | async)"
    >
      <main tuiScrollRef class="app-content">
        <tui-pull-to-refresh
          class="app-refresh"
          (pulled)="requestSynchronization()"
        >
          <router-outlet />
        </tui-pull-to-refresh>
      </main>
    </tui-loader>

    <app-floating-header (toggleDarkMode)="toggleDarkMode()" />

    <router-outlet name="sheet" />

    <app-floating-footer />
  </div>
</tui-root>
