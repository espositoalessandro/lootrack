<ng-template
  [tuiSheetDialog]="open"
  [tuiSheetDialogOptions]="options"
  (tuiSheetDialogChange)="onOpenChange($event)"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <tui-textfield tuiAnimated>
      <label for="amount-input" tuiLabel>
        {{ 'newTransaction.amount' | transloco }}</label
      >
      <input
        id="amount-input"
        tuiInput
        formControlName="amount"
        type="number"
        [placeholder]="'newTransaction.amountPlaceholder' | transloco"
      />
    </tui-textfield>
    <tui-textfield tuiAnimated>
      <label for="description-input" tuiLabel>
        {{ 'newTransaction.description' | transloco }}</label
      >
      <input
        id="description-input"
        tuiInput
        formControlName="description"
        type="text"
        [placeholder]="'newTransaction.descriptionPlaceholder' | transloco"
      />
    </tui-textfield>
    <tui-textfield tuiAnimated tuiDropdownSheet="Choose a date">
      <label for="occurred-input" tuiLabel>Choose a date</label>
      <input id="occurred-input" tuiInputDate formControlName="occurred" />
      <tui-calendar *tuiDropdown />
    </tui-textfield>
    <tui-segmented
      size="m"
      class="flex w-full"
      [style.--tui-background-base]="
    form.controls.type.value === 'income'
      ? 'var(--tui-status-positive)'
      : 'var(--tui-status-negative)'"
    >
      <label class="flex-1">
        <input
          name="transaction-type-radio"
          type="radio"
          value="expense"
          formControlName="type"
        />
        {{ 'newTransaction.expense' | transloco }}
      </label>
      <label class="flex-1">
        <input
          name="transaction-type-radio"
          type="radio"
          value="income"
          formControlName="type"
        />
        {{ 'newTransaction.income' | transloco }}
      </label>
    </tui-segmented>
    <footer tuiFloatingContainer class="footer">
      <button size="m" tuiButton type="submit" [disabled]="form.invalid">
        {{ 'buttons.confirm' | transloco }}
      </button>
    </footer>
  </form>
</ng-template>
